<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel Admin · Blog SCVP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --paper-alt:#F5F7FA; --ink:#14181F; --ink-soft:#5C6672;
    --accent:#1D4FA3; --accent-soft:#E9F0FB; --amber:#B8791A; --amber-soft:#FBF1E1;
    --line:#E6E9EE; --danger:#B8341A; --danger-soft:#FBEAE6; --ok:#1A8C4B; --ok-soft:#E7F6ED;
    --shadow: 0 1px 2px rgba(20,24,31,.04), 0 10px 26px -14px rgba(20,24,31,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10141C; --paper-alt:#181D28; --ink:#ECF0F6; --ink-soft:#9AA5B6;
      --accent:#6C9BEA; --accent-soft:#1D2A42; --amber:#E7B366; --amber-soft:#332612;
      --line:#262D3C; --danger:#E7876C; --danger-soft:#3A2018; --ok:#6BCB94; --ok-soft:#153524;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#10141C; --paper-alt:#181D28; --ink:#ECF0F6; --ink-soft:#9AA5B6;
    --accent:#6C9BEA; --accent-soft:#1D2A42; --amber:#E7B366; --amber-soft:#332612;
    --line:#262D3C; --danger:#E7876C; --danger-soft:#3A2018; --ok:#6BCB94; --ok-soft:#153524;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-alt);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:"Inter",system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0;}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px;}
  a{color:inherit;}

  .topline{background:var(--paper);border-bottom:1px solid var(--line);}
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px 14px;padding:16px 0;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
  .brand-logo{height:34px;width:auto;border-radius:5px;flex:0 0 auto;}
  .brand .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px;white-space:nowrap;}
  .topline-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  @media (max-width:480px){ .brand .tag{display:none;} }
  .theme-toggle{display:flex;align-items:center;gap:6px;background:var(--paper-alt);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;}
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}

  button{font-family:inherit;cursor:pointer;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:border-color .15s,background .15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--paper);}
  .btn-primary:hover{opacity:.92;color:var(--paper);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn-ghost{border-color:transparent;background:none;}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  main{padding:32px 0 80px;}

  /* ---- login ---- */
  .login-shell{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow);}
  .login-card h1{font-size:19px;margin-bottom:6px;}
  .login-card p.sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=password], .field input[type=date], .field input[type=time], .field select, .field textarea{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;}
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  .error-msg{font-size:12.5px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:9px 12px;margin-bottom:14px;display:none;}
  .error-msg.show{display:block;}

  /* ---- list ---- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .toolbar h1{font-size:20px;}
  .list-search{flex:1;min-width:200px;max-width:320px;}
  .post-row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .post-thumb{flex:0 0 auto;width:52px;height:52px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;overflow:hidden;border:1px solid var(--line);}
  .post-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .post-body{flex:1;min-width:0;}
  .post-title{font-weight:700;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .post-meta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .badge-pub{background:var(--ok-soft);color:var(--ok);}
  .badge-draft{background:var(--amber-soft);color:var(--amber);}
  .post-actions{flex:0 0 auto;display:flex;gap:8px;}
  .empty{padding:50px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---- form ---- */
  .form-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px;}
  .form-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){ .row2,.row3{grid-template-columns:1fr;} }

  .img-upload{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .img-preview{flex:0 0 auto;width:140px;height:90px;border-radius:10px;border:1px solid var(--line);background:var(--paper-alt);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;text-align:center;}
  .img-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-upload-controls{flex:1;min-width:200px;}

  .rel-editor .rel-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--paper-alt);}
  .rel-row .rel-fields{flex:1;display:flex;flex-direction:column;gap:8px;}
  .rel-row input, .rel-row textarea{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink);}
  .rel-row textarea{min-height:52px;resize:vertical;}
  .rel-remove{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:7px;width:28px;height:28px;color:var(--ink-soft);font-size:14px;line-height:1;}
  .rel-remove:hover{border-color:var(--danger);color:var(--danger);}
  .rel-linked-badge{font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:3px 8px;display:inline-block;margin-bottom:8px;}
  .rel-explainer{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink);line-height:1.5;}
  .rel-explainer .ico{font-size:16px;flex:0 0 auto;line-height:1.3;}
  .rel-search-wrap{position:relative;margin-bottom:14px;}
  .rel-search-input{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper);color:var(--ink);}
  .rel-search-input:focus{border-color:var(--accent);outline:none;}
  .rel-search-results{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto;}
  .rel-search-results.show{display:block;}
  .rel-search-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .rel-search-item:last-child{border-bottom:none;}
  .rel-search-item:hover{background:var(--accent-soft);}
  .rel-search-title{font-size:13px;font-weight:700;color:var(--ink);}
  .rel-search-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .rel-search-empty{padding:12px;margin:0;}

  .fonte-editor .fonte-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--paper-alt);}
  .fonte-row .fonte-fields{flex:1;display:grid;grid-template-columns:1fr 1fr 130px;gap:8px;}
  @media (max-width:640px){ .fonte-row .fonte-fields{grid-template-columns:1fr;} }
  .fonte-row input, .fonte-row select{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink);}

  .meta-editor .meta-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--paper-alt);}
  .meta-row .meta-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:640px){ .meta-row .meta-fields{grid-template-columns:1fr;} }
  .meta-row input{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink);}
  .checkbox-field{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;}
  .checkbox-field input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;}
  .checkbox-field label{font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;}
  .checkbox-field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:400;text-transform:none;letter-spacing:0;}
  .legacy-note{font-size:11.5px;color:var(--amber);background:var(--amber-soft);border-radius:7px;padding:7px 10px;margin-bottom:10px;}

  .form-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast.err{background:var(--danger);}

  [hidden]{display:none!important;}
</style>
</head>

  try {
    var savedTheme = localStorage.getItem("scvp-theme");
    if (savedTheme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else if (savedTheme === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
</script>

  const $ = s => document.querySelector(s);
  let session = null;   // { access_token, refresh_token, expires_at }
  let POSTS = [];
  let editingId = null; // null = lista; "__new__" = criando; senão = id em edição
  let showConfig = false; // true = tela de Identidade visual
  let CONFIG = {};        // linha atual de public.blog_config (id="default")

  // ---------------------------------------------------------------- sessão
  function loadSession(){
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function saveSession(s){
    session = s;
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e){}
  }
  function clearSession(){
    session = null;
    try { localStorage.removeItem(SESSION_KEY); } catch(e){}
  }

  async function doLogin(password){
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: ADMIN_EMAIL, password: password })
    });
    if (!res.ok) throw new Error(res.status === 400 ? "Senha incorreta." : "Não foi possível entrar agora.");
    const data = await res.json();
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in * 1000) - 30000
    });
  }

  async function refreshSession(){
    if (!session || !session.refresh_token) return false;
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!res.ok) return false;
      const data = await res.json();
      saveSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in * 1000) - 30000
      });
      return true;
    } catch(e){ return false; }
  }

  async function ensureFreshSession(){
    if (!session) return false;
    if (Date.now() >= session.expires_at) return await refreshSession();
    return true;
  }

  // Fetch autenticado contra a API do Supabase (REST ou Storage), com uma
  // tentativa de refresh automático se o token tiver expirado no meio do caminho.
  async function authFetch(path, opts){
    opts = opts || {};
    if (!(await ensureFreshSession())){ logout(); throw new Error("Sessão expirada."); }
    const headers = Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + session.access_token
    }, opts.headers || {});
    let res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers }));
    if (res.status === 401){
      if (await refreshSession()){
        headers.Authorization = "Bearer " + session.access_token;
        res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers }));
      } else {
        logout();
        throw new Error("Sessão expirada.");
      }
    }
    return res;
  }

  function logout(){
    clearSession();
    editingId = null;
    render();
  }

  // ------------------------------------------------------------------ util
  function toast(msg, isErr){
    const t = $("#toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    setTimeout(() => { t.className = "toast"; }, 3200);
  }
  function esc(s){
    return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }
  function fmtDateTime(ts){
    // ts = timestamp do Supabase, ex: "2026-09-15 18:34:59.587131-03"
    if (!ts) return "";
    const datePart = ts.slice(0,10).split("-");
    if (datePart.length !== 3) return ts;
    const timeMatch = ts.match(/\d{2}:\d{2}/);
    return datePart[2] + "/" + datePart[1] + "/" + datePart[0] + (timeMatch ? " às " + timeMatch[0] : "");
  }
  function slugify(s){
    return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  }
  function normRelacionados(rel){
    if (!Array.isArray(rel)) return [];
    return rel.map(r => typeof r === "string" ? { titulo: r, resumo: "", post_id: "" } : { titulo: r.titulo || "", resumo: r.resumo || "", post_id: r.post_id || "" });
  }

  // -------------------------------------------------------------- carregar
  async function loadPosts(){
    const res = await authFetch("/rest/v1/blog_posts?select=*&order=data_publicacao.desc");
    if (!res.ok) throw new Error("Não foi possível carregar as matérias.");
    POSTS = await res.json();
  }

  async function loadConfig(){
    try {
      const res = await authFetch("/rest/v1/blog_config?select=*&id=eq.default");
      if (res.ok){
        const rows = await res.json();
        CONFIG = rows[0] || {};
      }
    } catch(e){ /* silencioso — a tela de identidade visual trata CONFIG vazio */ }
  }

  // ------------------------------------------------------------- renderers
  function render(){
    const loggedIn = !!session;
    $("#login-screen").hidden = loggedIn;
    $("#main-app").hidden = !loggedIn;
    $("#logged-in-actions").hidden = !loggedIn;
    if (!loggedIn) return;
    if (showConfig) renderConfig();
    else if (editingId) renderForm(editingId);
    else renderList();
  }

  let listQuery = "";

  function renderList(){
    let posts = POSTS.slice();
    if (listQuery){
      const q = listQuery.toLowerCase();
      posts = posts.filter(p => (p.titulo+" "+p.id+" "+p.categoria+" "+(p.concurso||"")).toLowerCase().includes(q));
    }
    let html = '<div class="toolbar"><h1>Matérias (' + POSTS.length + ')</h1>' +
      '<input class="list-search" type="text" id="list-search" placeholder="Buscar por título, id, categoria..." value="'+esc(listQuery)+'">' +
      '<button class="btn btn-primary" id="btn-new">+ Nova matéria</button></div>';

    if (!posts.length){
      html += '<div class="empty">Nenhuma matéria encontrada.</div>';
    } else {
      posts.forEach(p => {
        const isPub = p.status === "publicado";
        const tipoLabel = {"noticia":"📰 Notícia","dica-de-estudo":"📘 Dica de estudo"}[p.tipo_conteudo];
        const destLabel = {"manchete":"🏆 Manchete","destaque":"⭐ Destaque"}[p.classificacao];
        html += '<div class="post-row">' +
          '<div class="post-thumb">' + ((p.imagem_miniatura||p.imagem_capa) ? '<img src="'+esc(p.imagem_miniatura||p.imagem_capa)+'" alt="">' : esc((p.categoria||"").slice(0,4).toUpperCase())) + '</div>' +
          '<div class="post-body">' +
            '<div class="post-title">'+esc(p.titulo)+'</div>' +
            '<div class="post-meta">' +
              '<span class="badge '+(isPub?"badge-pub":"badge-draft")+'">'+esc(p.status||"—")+'</span>' +
              (destLabel ? '<span class="badge badge-pub">'+destLabel+'</span>' : '') +
              (p.info_nao_oficial ? '<span class="badge badge-draft">⚠️ não oficial</span>' : '') +
              (tipoLabel ? '<span>'+tipoLabel+'</span>' : '') +
              '<span>'+esc(p.categoria)+' · '+esc(UF_NAMES[p.uf]||p.uf||"—")+'</span>' +
              '<span class="mono">'+esc(p.data_publicacao||"")+'</span>' +
              '<span class="mono" style="opacity:.6">'+esc(p.id)+'</span>' +
            '</div>' +
          '</div>' +
          '<div class="post-actions">' +
            '<button class="btn btn-sm" data-edit="'+esc(p.id)+'">Editar</button>' +
            '<button class="btn btn-sm btn-danger" data-del="'+esc(p.id)+'">Excluir</button>' +
          '</div>' +
        '</div>';
      });
    }
    $("#main-app").innerHTML = html;

    $("#btn-new").addEventListener("click", () => { editingId = "__new__"; render(); });
    const search = $("#list-search");
    search.addEventListener("input", () => {
      listQuery = search.value;
      renderList();
      const el = $("#list-search");
      el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    });
    document.querySelectorAll("[data-edit]").forEach(el => {
      el.addEventListener("click", () => { editingId = el.dataset.edit; render(); });
    });
    document.querySelectorAll("[data-del]").forEach(el => {
      el.addEventListener("click", () => deletePost(el.dataset.del));
    });
  }

  async function deletePost(id){
    const p = POSTS.find(x => x.id === id);
    if (!confirm('Excluir de vez a matéria "'+(p?p.titulo:id)+'"? Essa ação não pode ser desfeita.')) return;
    try {
      const res = await authFetch("/rest/v1/blog_posts?id=eq." + encodeURIComponent(id), { method: "DELETE" });
      if (!res.ok) throw new Error("Falha ao excluir (HTTP " + res.status + ")");
      await loadPosts();
      toast("Matéria excluída.");
      render();
    } catch(e){ toast(e.message, true); }
  }

  function blankPost(){
    return { id:"", titulo:"", categoria:"", uf:"", concurso:"", resumo:"", conteudo:"",
      highlight_num:"", highlight_label:"", imagem_capa:"", imagem_miniatura:"", imagem_manchete:"", link_original:"",
      relacionados: [], data_publicacao: new Date().toISOString().slice(0,10),
      hora_publicacao:"", status:"rascunho", tipo_conteudo:"concurso", meta_descricao:"",
      fontes: [], info_nao_oficial:false, nota_nao_oficial:"",
      classificacao:"recente", ordem_destaque:"", metadados: [] };
  }
  function normMetadados(m){
    if (!Array.isArray(m)) return [];
    return m.map(x => ({ property: x.property || "", content: x.content || "" }));
  }
  function normFontes(f){
    if (!Array.isArray(f)) return [];
    return f.map(x => typeof x === "string" ? { label: x, url:"", tipo:"secundaria" } : {
      label: x.label || "", url: x.url || "", tipo: x.tipo === "oficial" ? "oficial" : "secundaria"
    });
  }

      (manchCount >= 5 || destCount >= 5 ? ' <span style="color:var(--danger)">No limite — marcar tira outra da lista.</span>' : '') +
      ' Sem nenhuma marcada, o site usa as mais recentes automaticamente.' +

    html += '</div>';

    html += '<div class="form-card"><h3>Conteúdo</h3>';
    html += field_text("titulo", "Título", post.titulo, "", "");
    html += field_textarea("resumo", "Resumo (aparece nos cards e na home)", post.resumo, 3);
    html += field_textarea("conteudo", "Corpo da matéria", post.conteudo, 14, "mono");
    html += '<button class="btn btn-sm" id="btn-insert-link" type="button" style="margin-top:8px;">🔗 Inserir link</button>';
    html += '<div class="hint">"## " vira subtítulo · linha com "&lt;" é HTML puro · resto vira parágrafo. Selecione um texto e clique "Inserir link" pra linkar.</div>';
    html += '<div class="row2" style="margin-top:14px;">';
    html += field_text("highlight_num", "Número de destaque (opcional)", post.highlight_num, "", "ex: 400");
    html += field_text("highlight_label", "Legenda do destaque", post.highlight_label, "", "ex: vagas previstas");
    html += '</div></div>';

    html += '<div class="form-card"><h3>Transparência editorial</h3>';
    html += '<div class="checkbox-field"><input type="checkbox" id="info_nao_oficial"' + (post.info_nao_oficial ? ' checked' : '') + '>' +
      '<div><label for="info_nao_oficial">Contém informação ainda não oficial</label>' +
      '<div class="hint">Marque se a matéria traz previsão/estimativa (ex: pré-edital). Mostra um aviso no topo da matéria, no site.</div></div></div>';

    html += '<div class="form-card"><h3>Imagens</h3>';
    html += '<div class="img-upload">' +

      '<div class="img-upload-controls">' +
        field_text("imagem_manchete", "Banner da manchete (opcional)", post.imagem_manchete, "", "se deixar em branco, usamos a imagem principal") +

        '<div class="hint" id="img-upload-status-manchete"></div>' +
      '</div>' +
    '</div>';
    html += '<div class="img-upload" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">' +
      '<div class="img-preview" id="img-preview-thumb">' + (post.imagem_miniatura ? '<img src="'+esc(post.imagem_miniatura)+'" alt="">' : "Usa a de capa") + '</div>' +
      '<div class="img-upload-controls">' +
        field_text("imagem_miniatura", "Imagem miniatura (opcional)", post.imagem_miniatura, "", "se deixar em branco, usamos a imagem de capa") +
        '<input type="file" id="img-file-thumb" accept="image/*" style="margin-top:6px;font-size:12.5px;">' +
        '<div class="hint">Card "Concursos em destaque" e listas do painel. Ideal: <strong>300×300px</strong>, quadrada.</div>' +

    const relSearchResults = $("#rel-search-results");
    relSearchInput.addEventListener("input", () => {
      const alreadyIds = Array.from(document.querySelectorAll("#rel-editor .rel-post-id")).map(el => el.value).filter(Boolean);
      relSearchResults.innerHTML = relSearchResultsHtml(relSearchInput.value, post.id, alreadyIds);
      relSearchResults.classList.toggle("show", !!relSearchInput.value.trim());
      relSearchResults.querySelectorAll(".rel-search-item").forEach(item => {
        item.addEventListener("click", () => {
          const p = POSTS.find(x => x.id === item.dataset.id);
          if (!p) return;
          addRelRow({ titulo: p.titulo, resumo: p.resumo || "", post_id: p.id });
          relSearchInput.value = "";
          relSearchResults.innerHTML = "";
          relSearchResults.classList.remove("show");
        });
      });
    });
    document.addEventListener("click", (e) => {
      if (relSearchResults && !relSearchResults.contains(e.target) && e.target !== relSearchInput) relSearchResults.classList.remove("show");
    });
    $("#fonte-add").addEventListener("click", () => { addFonteRow(); });
    document.querySelectorAll("#fonte-editor .fonte-remove").forEach(bindFonteRemove);
    $("#meta-add").addEventListener("click", () => { addMetaRow(); });
    document.querySelectorAll("#meta-editor .meta-remove").forEach(bindMetaRemove);
    $("#imagem_capa").addEventListener("input", () => {
      $("#img-preview").innerHTML = $("#imagem_capa").value ? '<img src="'+esc($("#imagem_capa").value)+'" alt="">' : "Sem imagem";
    });
    $("#imagem_manchete").addEventListener("input", () => {
      $("#img-preview-manchete").innerHTML = $("#imagem_manchete").value ? '<img src="'+esc($("#imagem_manchete").value)+'" alt="">' : "Usa a imagem principal";
    });
    $("#imagem_miniatura").addEventListener("input", () => {
      $("#img-preview-thumb").innerHTML = $("#imagem_miniatura").value ? '<img src="'+esc($("#imagem_miniatura").value)+'" alt="">' : "Usa a de capa";
    });
    $("#img-file").addEventListener("change", (e) => uploadImage(e.target.files[0], isNew ? $("#id").value : post.id, {
      inputId: "imagem_capa", previewId: "img-preview", statusId: "img-upload-status", emptyLabel: "Sem imagem"
    }));
    $("#img-file-manchete").addEventListener("change", (e) => uploadImage(e.target.files[0], isNew ? $("#id").value : post.id, {
      inputId: "imagem_manchete", previewId: "img-preview-manchete", statusId: "img-upload-status-manchete", emptyLabel: "Usa a imagem principal", pathPrefix: "manchetes/"
    }));
    $("#img-file-thumb").addEventListener("change", (e) => uploadImage(e.target.files[0], isNew ? $("#id").value : post.id, {
      inputId: "imagem_miniatura", previewId: "img-preview-thumb", statusId: "img-upload-status-thumb", emptyLabel: "Usa a de capa"
    }));
    $("#classificacao").addEventListener("change", () => {
      const val = $("#classificacao").value;
      const mc = POSTS.filter(x => x.classificacao === "manchete" && x.id !== post.id).length + (val === "manchete" ? 1 : 0);
      const dc = POSTS.filter(x => x.classificacao === "destaque" && x.id !== post.id).length + (val === "destaque" ? 1 : 0);
      $("#destaque-count-hint").innerHTML = 'Marque Manchete/Destaque só se quiser forçar essa matéria numa das 5 vagas (senão, deixe "Publicação recente"). Com essa escolha: <strong>'+mc+'/5</strong> Manchete, <strong>'+dc+'/5</strong> Destaque.' +
        (mc > 5 || dc > 5 ? ' <span style="color:var(--danger)">Passou do limite — a de ordem mais alta fica de fora.</span>' : '') +
        ' Sem nenhuma marcada, o site usa as mais recentes automaticamente.';
    });
    $("#btn-insert-link").addEventListener("click", insertLinkIntoConteudo);
    $("#btn-save").addEventListener("click", () => savePost(isNew, post.id));
    if (isNew) $("#id").addEventListener("input", () => { $("#id").value = slugify($("#id").value); });
  }

      '<div class="img-upload-controls">' +
        field_text("logo_light_bg_url", "Logo para fundo claro (colorida)", c.logo_light_bg_url, "", "cole uma URL ou envie um arquivo abaixo") +
        '<input type="file" id="logo-file-light" accept="image/*,.svg,image/svg+xml" style="margin-top:6px;font-size:12.5px;">' +
        '<div class="hint">Fundos claros (ex: este painel). SVG/PNG transparente, cor da marca.</div>' +
        '<div class="hint" id="logo-upload-status-light"></div>' +
      '</div>' +
    '</div></div>';

    html += '<div class="form-footer">' +
      '<button class="btn btn-primary" id="btn-config-save">Salvar identidade visual</button>' +
      '<span class="hint" id="config-save-status"></span>' +
    '</div>';

    $("#main-app").innerHTML = html;
    $("#btn-config-back").addEventListener("click", () => { showConfig = false; render(); });
    $("#logo_dark_bg_url").addEventListener("input", () => {
      $("#logo-preview-dark").innerHTML = $("#logo_dark_bg_url").value ? '<img src="'+esc($("#logo_dark_bg_url").value)+'" alt="" style="object-fit:contain;">' : '<span style="color:#fff;">Sem logo</span>';
    });
    $("#logo_light_bg_url").addEventListener("input", () => {
      $("#logo-preview-light").innerHTML = $("#logo_light_bg_url").value ? '<img src="'+esc($("#logo_light_bg_url").value)+'" alt="" style="object-fit:contain;">' : "Sem logo";
    });
    $("#logo-file-dark").addEventListener("change", (e) => uploadImage(e.target.files[0], "logo", {
      inputId: "logo_dark_bg_url", previewId: "logo-preview-dark", statusId: "logo-upload-status-dark", emptyLabel: "Sem logo", pathPrefix: "identidade/"
    }));
    $("#logo-file-light").addEventListener("change", (e) => uploadImage(e.target.files[0], "logo", {
      inputId: "logo_light_bg_url", previewId: "logo-preview-light", statusId: "logo-upload-status-light", emptyLabel: "Sem logo", pathPrefix: "identidade/"
    }));
    $("#btn-config-save").addEventListener("click", saveConfig);
  }

  async function saveConfig(){
    const statusEl = $("#config-save-status");
    const payload = {
      id: "default",
      logo_dark_bg_url: $("#logo_dark_bg_url").value.trim(),
      logo_light_bg_url: $("#logo_light_bg_url").value.trim(),
      updated_at: new Date().toISOString()
    };
    $("#btn-config-save").disabled = true;
    statusEl.textContent = "Salvando...";
    try {
      const res = await authFetch("/rest/v1/blog_config", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Falha ao salvar (HTTP " + res.status + ")");
      await loadConfig();
      toast("Identidade visual salva.");
      statusEl.textContent = "";
    } catch(e){
      statusEl.textContent = "";
      toast(e.message, true);
    } finally {
      $("#btn-config-save").disabled = false;
    }
  }

  // Ajuda quem edita a colar um link sem precisar escrever a tag HTML à
  // mão: se houver texto selecionado no corpo, vira o texto do link; senão,
  // pede o texto também. Insere <a href="..." target="_blank" rel="noopener">
  // na posição do cursor (o corpo já aceita HTML solto, então funciona
  // direto sem precisar do modo "colar HTML puro").
  function insertLinkIntoConteudo(){
    const ta = $("#conteudo");
    const start = ta.selectionStart, end = ta.selectionEnd;
    const selected = ta.value.slice(start, end);
    const url = prompt("URL do link (ex: https://...):", "https://");
    if (!url) return;
    const texto = selected || prompt("Texto do link:", "") || url;
    const tag = '<a href="' + url.trim() + '" target="_blank" rel="noopener">' + texto + '</a>';
    ta.value = ta.value.slice(0, start) + tag + ta.value.slice(end);
    ta.focus();
    const newPos = start + tag.length;
    ta.setSelectionRange(newPos, newPos);
  }

  function field_text(id,label,val,extra,ph){
    return '<div class="field"><label for="'+id+'">'+label+'</label>' +
      '<input type="text" id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'" '+(extra||"")+'></div>';
  }
  function field_date(id,label,val){
    return '<div class="field"><label for="'+id+'">'+label+'</label><input type="date" id="'+id+'" value="'+esc(val||"")+'"></div>';
  }
  function field_textarea(id,label,val,rows,cls){
    return '<div class="field"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" rows="'+rows+'" style="'+(cls==="mono"?"font-family:ui-monospace,Menlo,monospace;font-size:13px;":"")+'">'+esc(val)+'</textarea></div>';
  }
  function field_select(id,label,val,opts){
    let h = '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'">';
    opts.forEach(o => { h += '<option value="'+o[0]+'"'+(val===o[0]?" selected":"")+'>'+o[1]+'</option>'; });
    return h + '</select></div>';
  }

  function relRowInnerHtml(r){
    r = r || { titulo:"", resumo:"", post_id:"" };
    const linked = !!r.post_id;
    return (linked ? '<div class="rel-linked-badge">🔗 Vinculado a matéria existente do painel</div>' : '') +
      '<input type="hidden" class="rel-post-id" value="'+esc(r.post_id)+'">' +
      '<div class="rel-fields">' +
        '<input type="text" class="rel-titulo" value="'+esc(r.titulo)+'" placeholder="Título do item">' +
        '<textarea class="rel-resumo" placeholder="Resumo (1-3 frases)">'+esc(r.resumo)+'</textarea>' +
      '</div><button class="rel-remove" type="button" title="Remover">×</button>';
  }
  function relRowsHtml(rows){
    if (!rows.length) return '<p class="hint" style="margin:0 0 10px;">Nenhum item ainda. Busque uma matéria abaixo ou use "+ Adicionar item em branco".</p>';
    return rows.map((r,i) => '<div class="rel-row" data-idx="'+i+'">' + relRowInnerHtml(r) + '</div>').join("");
  }
  function addRelRow(prefill){
    const wrap = $("#rel-editor");
    const empty = wrap.querySelector(".hint");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "rel-row";
    div.innerHTML = relRowInnerHtml(prefill);
    wrap.appendChild(div);
    bindRelRemove(div.querySelector(".rel-remove"));
  }
  function bindRelRemove(btn){
    btn.addEventListener("click", () => {
      const row = btn.closest(".rel-row");
      row.remove();
      if (!$("#rel-editor").querySelector(".rel-row")) $("#rel-editor").innerHTML = '<p class="hint" style="margin:0 0 10px;">Nenhum item ainda. Busque uma matéria abaixo ou use "+ Adicionar item em branco".</p>';
    });
  }
  function collectRel(){
    return Array.from(document.querySelectorAll("#rel-editor .rel-row")).map(row => ({
      titulo: row.querySelector(".rel-titulo").value.trim(),
      resumo: row.querySelector(".rel-resumo").value.trim(),
      post_id: (row.querySelector(".rel-post-id") || {}).value || ""
    })).filter(r => r.titulo);
  }
  function relSearchResultsHtml(q, currentId, alreadyIds){
    q = q.trim().toLowerCase();
    if (!q) return "";
    const matches = POSTS.filter(p => p.id !== currentId && !alreadyIds.includes(p.id) &&
      (p.titulo.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || (p.concurso||"").toLowerCase().includes(q))
    ).slice(0, 8);
    if (!matches.length) return '<div class="rel-search-empty hint">Nenhuma matéria encontrada com esse termo.</div>';
    return matches.map(p =>
      '<div class="rel-search-item" data-id="'+esc(p.id)+'">' +
        '<div class="rel-search-title">'+esc(p.titulo)+'</div>' +
        '<div class="rel-search-meta">'+esc(p.categoria)+' · '+esc(UF_NAMES[p.uf]||p.uf||"—")+'</div>' +
      '</div>'
    ).join("");
  }

  function fonteFieldsHtml(f){
    f = f || { label:"", url:"", tipo:"secundaria" };
    return '<div class="fonte-fields">' +
      '<input type="text" class="fonte-label" value="'+esc(f.label)+'" placeholder="Nome da fonte (ex: Diário Oficial do Amazonas)">' +
      '<input type="text" class="fonte-url" value="'+esc(f.url)+'" placeholder="Link (opcional)">' +
      '<select class="fonte-tipo">' +
        '<option value="oficial"'+(f.tipo==="oficial"?" selected":"")+'>Oficial</option>' +
        '<option value="secundaria"'+(f.tipo!=="oficial"?" selected":"")+'>Secundária</option>' +
      '</select>' +
    '</div>';
  }
  function fonteRowsHtml(rows){
    if (!rows.length) return '<p class="hint" style="margin:0 0 10px;">Nenhuma fonte ainda. Use "+ Adicionar fonte" abaixo.</p>';
    return rows.map((f,i) =>
      '<div class="fonte-row" data-idx="'+i+'">' + fonteFieldsHtml(f) + '<button class="rel-remove fonte-remove" type="button" title="Remover">×</button></div>'
    ).join("");
  }
  function addFonteRow(){
    const wrap = $("#fonte-editor");
    const empty = wrap.querySelector(".hint");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "fonte-row";
    div.innerHTML = fonteFieldsHtml(null) + '<button class="rel-remove fonte-remove" type="button" title="Remover">×</button>';
    wrap.appendChild(div);
    bindFonteRemove(div.querySelector(".fonte-remove"));
  }
  function bindFonteRemove(btn){
    btn.addEventListener("click", () => {
      const row = btn.closest(".fonte-row");
      row.remove();
      if (!$("#fonte-editor").querySelector(".fonte-row")) $("#fonte-editor").innerHTML = '<p class="hint" style="margin:0 0 10px;">Nenhuma fonte ainda. Use "+ Adicionar fonte" abaixo.</p>';
    });
  }
  function collectFontes(){
    return Array.from(document.querySelectorAll("#fonte-editor .fonte-row")).map(row => ({
      label: row.querySelector(".fonte-label").value.trim(),
      url: row.querySelector(".fonte-url").value.trim(),
      tipo: row.querySelector(".fonte-tipo").value
    })).filter(f => f.label || f.url);
  }

  function metaFieldsHtml(m){
    m = m || { property:"", content:"" };
    return '<div class="meta-fields">' +
      '<input type="text" class="meta-property" value="'+esc(m.property)+'" placeholder="Property (ex: article:description)">' +
      '<input type="text" class="meta-content" value="'+esc(m.content)+'" placeholder="Content">' +
    '</div>';
  }
  function metaRowsHtml(rows){
    if (!rows.length) return '<p class="hint" style="margin:0 0 10px;">Nenhum metadado extra ainda.</p>';
    return rows.map((m,i) =>
      '<div class="meta-row" data-idx="'+i+'">' + metaFieldsHtml(m) + '<button class="rel-remove meta-remove" type="button" title="Remover">×</button></div>'
    ).join("");
  }
  function addMetaRow(){
    const wrap = $("#meta-editor");
    const empty = wrap.querySelector(".hint");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "meta-row";
    div.innerHTML = metaFieldsHtml(null) + '<button class="rel-remove meta-remove" type="button" title="Remover">×</button>';
    wrap.appendChild(div);
    bindMetaRemove(div.querySelector(".meta-remove"));
  }
  function bindMetaRemove(btn){
    btn.addEventListener("click", () => {
      const row = btn.closest(".meta-row");
      row.remove();
      if (!$("#meta-editor").querySelector(".meta-row")) $("#meta-editor").innerHTML = '<p class="hint" style="margin:0 0 10px;">Nenhum metadado extra ainda.</p>';
    });
  }
  function collectMetadados(){
    return Array.from(document.querySelectorAll("#meta-editor .meta-row")).map(row => ({
      property: row.querySelector(".meta-property").value.trim(),
      content: row.querySelector(".meta-content").value.trim()
    })).filter(m => m.property && m.content);
  }

  async function uploadImage(file, idHint, target){
    if (!file) return;
    target = target || { inputId: "imagem_capa", previewId: "img-preview", statusId: "img-upload-status", emptyLabel: "Sem imagem" };
    const statusEl = $("#" + target.statusId);
    statusEl.textContent = "Enviando imagem...";
    try {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
      const suffix = target.inputId === "imagem_miniatura" ? "-mini" : "";
      const prefix = target.pathPrefix || "capas/";
      const path = prefix + (slugify(idHint) || "arquivo") + suffix + "-" + Date.now() + "." + ext;
      const buf = await file.arrayBuffer();
      const res = await authFetch("/storage/v1/object/blog-imagens/" + path, {
        method: "POST",
        headers: { "Content-Type": file.type || "application/octet-stream" },
        body: buf
      });
      if (!res.ok) throw new Error("Falha no envio (HTTP " + res.status + ")");
      const publicUrl = SUPABASE_URL + "/storage/v1/object/public/blog-imagens/" + path;
      $("#" + target.inputId).value = publicUrl;
      $("#" + target.previewId).innerHTML = '<img src="'+esc(publicUrl)+'" alt="">';
      statusEl.textContent = "Imagem enviada ✓";
      toast("Imagem enviada.");
    } catch(e){
      statusEl.textContent = "";
      toast(e.message, true);
    }
  }

  async function savePost(isNew, originalId){
    const statusEl = $("#save-status");
    const id = isNew ? $("#id").value.trim() : originalId;
    if (!id){ toast("Preencha o ID/slug da matéria.", true); return; }
    const titulo = $("#titulo").value.trim();
    const categoria = $("#categoria").value.trim();
    if (!titulo || !categoria){ toast("Título e categoria são obrigatórios.", true); return; }

    const payload = {
      titulo: titulo,
      categoria: categoria,
      uf: $("#uf").value.trim(),
      concurso: $("#concurso").value.trim(),
      resumo: $("#resumo").value.trim(),
      conteudo: $("#conteudo").value,
      highlight_num: $("#highlight_num").value.trim(),
      highlight_label: $("#highlight_label").value.trim(),
      imagem_capa: $("#imagem_capa").value.trim(),
      imagem_miniatura: $("#imagem_miniatura").value.trim(),
      imagem_manchete: $("#imagem_manchete").value.trim(),
      link_original: $("#link_original").value.trim(),
      relacionados: collectRel(),
      data_publicacao: $("#data_publicacao").value || null,
      hora_publicacao: $("#hora_publicacao").value.trim(),
      status: $("#status").value,
      tipo_conteudo: $("#tipo_conteudo").value,
      classificacao: $("#classificacao").value,
      ordem_destaque: $("#ordem_destaque").value.trim() ? parseInt($("#ordem_destaque").value.trim(), 10) : null,
      meta_descricao: $("#meta_descricao").value.trim(),
      metadados: collectMetadados(),
      fontes: collectFontes(),
      info_nao_oficial: $("#info_nao_oficial").checked,
      nota_nao_oficial: $("#nota_nao_oficial").value.trim()
    };

    $("#btn-save").disabled = true;
    statusEl.textContent = "Salvando...";
    try {
      let res;
      if (isNew){
        payload.id = id;
        res = await authFetch("/rest/v1/blog_posts", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify(payload)
        });
      } else {
        res = await authFetch("/rest/v1/blog_posts?id=eq." + encodeURIComponent(id), {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify(payload)
        });
      }
      if (!res.ok){
        const errBody = await res.text();
        throw new Error(res.status === 409 || errBody.indexOf("duplicate") > -1 ? "Já existe uma matéria com esse ID." : "Falha ao salvar (HTTP " + res.status + ")");
      }
      await loadPosts();
      toast(isNew ? "Matéria criada." : "Alterações salvas.");
      editingId = null;
      render();
    } catch(e){
      statusEl.textContent = "";
      toast(e.message, true);
    } finally {
      $("#btn-save").disabled = false;
    }
  }

  // ------------------------------------------------------------------ boot
  $("#btn-login").addEventListener("click", async () => {
    const pass = $("#login-password").value;
    const errEl = $("#login-error");
    errEl.className = "error-msg";
    if (!pass){ errEl.textContent = "Digite a senha."; errEl.className = "error-msg show"; return; }
    $("#btn-login").disabled = true;
    try {
      await doLogin(pass);
      await loadPosts();
      await loadConfig();
      applyBrandLogo();
      render();
    } catch(e){
      errEl.textContent = e.message;
      errEl.className = "error-msg show";
    } finally {
      $("#btn-login").disabled = false;
    }
  });
  $("#login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#btn-login").click(); });
  $("#btn-logout").addEventListener("click", logout);
  $("#btn-config").addEventListener("click", () => { showConfig = true; editingId = null; render(); });

  function applyThemeLabel(){
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    $("#theme-icon").textContent = isDark ? "☀" : "☾";
    $("#theme-label").textContent = isDark ? "Claro" : "Escuro";
  }
  // O cabeçalho deste painel usa var(--paper), que muda com o tema (claro/escuro),
  // então (diferente do masthead fixo do blog público) a logo aqui precisa trocar
  // de variante conforme o tema atual. Usa o que estiver salvo em CONFIG
  // (Identidade visual), com o PNG colorido padrão como reserva.
  function applyBrandLogo(){
    const img = $("#brand-logo-img");
    if (!img) return;
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const url = (isDark ? CONFIG.logo_dark_bg_url : CONFIG.logo_light_bg_url) || DEFAULT_LOGO_URL;
    img.src = url;
  }
  $("#theme-toggle").addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (isDark){
      document.documentElement.setAttribute("data-theme", "light");
      try { localStorage.setItem("scvp-theme", "light"); } catch(e){}
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      try { localStorage.setItem("scvp-theme", "dark"); } catch(e){}
    }
    applyThemeLabel();
    applyBrandLogo();
  });
  applyThemeLabel();

  (async function init(){
    session = loadSession();
    if (session){
      try {
        if (await ensureFreshSession()){
          await loadPosts();
          await loadConfig();
          applyBrandLogo();
        } else {
          session = null;
        }
      } catch(e){ session = null; }
    }
    render();
  })();
})();
</script>
